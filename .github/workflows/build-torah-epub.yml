name: Build Torah EPUB

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR build branch
        uses: actions/checkout@v4

      - name: Install Hebrew font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          fc-match 'Noto Serif Hebrew'

      - name: Map Hebcal boundaries onto Sefaria versification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build_torah_remote.py')
          s=p.read_text(encoding='utf-8')

          anchor="def load_metsudah(book):"
          insert=r'''def load_mam_ajf(book):
              url = raw_url(MAM_REPO, MAM_REV, f'csv-ajf/{book}.csv')
              text = download_text(url)
              verses = {}
              for row in csv.reader(io.StringIO(text)):
                  if len(row) < 2: continue
                  m = re.fullmatch(re.escape(book) + r' (\d+):(\d+)', row[0].strip())
                  if not m: continue
                  verses[(int(m.group(1)), int(m.group(2)))] = clean_mam(row[1])
              if not verses: raise RuntimeError(f'No MAM-AJF verses parsed for {book}')
              return verses

          def make_alignment(book, sefaria, ajf):
              def canon(t):
                  # AJF retains some explicit paseq separators that the Sefaria-format
                  # MAM export treats as layout metadata. Ignore only whitespace and paseq.
                  return re.sub(r'[\s\u05C0]+', '', t)
              s_order = sorted(sefaria)
              a_order = sorted(ajf)
              s_start = {}; s_end = {}; pos = 0; s_parts = []
              for ref in s_order:
                  txt = canon(sefaria[ref]); s_start[pos] = ref; pos += len(txt); s_end[pos] = ref; s_parts.append(txt)
              s_all = ''.join(s_parts)
              a_spans = {}; pos = 0; a_parts = []
              for ref in a_order:
                  txt = canon(ajf[ref]); a_spans[ref] = (pos, pos + len(txt)); pos += len(txt); a_parts.append(txt)
              a_all = ''.join(a_parts)
              if s_all != a_all:
                  lim = min(len(s_all), len(a_all)); i = next((i for i in range(lim) if s_all[i] != a_all[i]), lim)
                  raise RuntimeError(f'MAM Sefaria/AJF text mismatch in {book} at char {i}: {s_all[i:i+30]!r} vs {a_all[i:i+30]!r}')
              return a_spans, s_start, s_end

          def map_ajf_start(book, ref, alignment, context):
              spans, starts, ends = alignment
              if ref not in spans: raise RuntimeError(f'{context}: AJF ref not found {book} {ref}')
              off = spans[ref][0]
              if off not in starts:
                  raise RuntimeError(f'{context}: leyning start {book} {ref} falls inside a Sefaria verse at char {off}')
              return starts[off]

          def map_ajf_end(book, ref, alignment, context):
              spans, starts, ends = alignment
              if ref not in spans: raise RuntimeError(f'{context}: AJF ref not found {book} {ref}')
              off = spans[ref][1]
              if off not in ends:
                  raise RuntimeError(f'{context}: leyning end {book} {ref} falls inside a Sefaria verse at char {off}')
              return ends[off]

          '''
          insert='\n'.join(line[10:] if line.startswith('          ') else line for line in insert.splitlines())
          assert anchor in s
          s=s.replace(anchor,insert+anchor,1)

          old="    he_books={}; en_books={}; br_books={}; en_licenses={}"
          assert old in s
          s=s.replace(old,"    he_books={}; en_books={}; br_books={}; en_licenses={}; alignments={}",1)

          needle="            raise RuntimeError(f'Verse mismatch {book}; missing EN {missing_en}; missing HE {missing_he}')"
          assert needle in s
          s=s.replace(needle, needle+"\n        ajf = load_mam_ajf(book)\n        alignments[book] = make_alignment(book, he_books[book], ajf)",1)

          old="        starts=[parse_ref(fk[str(i)][0]) for i in range(1,8)]"
          assert old in s
          s=s.replace(old,"        ajf_starts=[parse_ref(fk[str(i)][0]) for i in range(1,8)]\n        starts=[map_ajf_start(book, r, alignments[book], f'{name} aliyah {i+1}') for i,r in enumerate(ajf_starts)]",1)

          old="        end=parse_ref(fk['7'][1])"
          assert old in s
          s=s.replace(old,"        ajf_end=parse_ref(fk['7'][1])\n        end=map_ajf_end(book, ajf_end, alignments[book], f'{name} seventh aliyah end')",1)

          old="        if not m_rng: raise RuntimeError(f'No Maftir for {name}')\n        maftir=parse_ref(m_rng[0])"
          assert old in s
          s=s.replace(old,"        maftir=map_ajf_start(book, parse_ref(m_rng[0]), alignments[book], f'{name} Maftir') if m_rng else None",1)

          old="        for r in starts+[maftir]:\n            if r not in set(refs): raise RuntimeError(f'Boundary {r} outside {name}')"
          assert old in s
          s=s.replace(old,"        for r in starts + ([maftir] if maftir else []):\n            if r not in set(refs): raise RuntimeError(f'Boundary {r} outside {name}')",1)

          old="        if joined.count('class=\"maftir\"') != 54*2: raise RuntimeError('Maftir marker count mismatch')"
          assert old in s
          s=s.replace(old,"        if joined.count('class=\"maftir\"') != 53*2: raise RuntimeError('Maftir marker count mismatch')",1)

          s=s.replace("        'Aliyah source: Hebcal leyning',","        'Aliyah source: Hebcal leyning, mapped through MAM-AJF character alignment',",1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build and validate EPUB
        run: python3 build_torah_remote.py

      - name: Inspect EPUB archive
        run: |
          unzip -t Torah_Hebrew_Metsudah_Eli_Spiro.epub
          cat torah_build_report.txt

      - name: Upload finished EPUB
        uses: actions/upload-artifact@v4
        with:
          name: torah-epub
          if-no-files-found: error
          retention-days: 1
          path: |
            Torah_Hebrew_Metsudah_Eli_Spiro.epub
            torah_build_report.txt
