<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Nach Yomi Redirect</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        .container { text-align: center; padding: 40px; border-radius: 12px; background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 400px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #2d3436; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: #2d3436; margin-bottom: 10px; }
        p { color: #636e72; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Nach Yomi</h2>
        <div class="loader"></div>
        <p id="status">Redirecting to today's chapter on Sefaria...</p>
    </div>

    <script>
        // The script calculates today's date and matches it against the 3-cycle schedule.
        // It then redirects to https://www.sefaria.org/Book.Chapter
        
        async function startRedirect() {
            // Mapping logic embedded or fetched
            const startDate = new Date(2026, 1, 12); // Feb 12, 2026
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const diffTime = today - startDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
                document.getElementById('status').innerText = "The program hasn't started yet! First day is Feb 12, 2026.";
                return;
            }

            const books = [
                ["Joshua", 24], ["Judges", 21], ["I_Samuel", 31], ["II_Samuel", 24],
                ["I_Kings", 22], ["II_Kings", 25], ["Isaiah", 66], ["Jeremiah", 52],
                ["Ezekiel", 48], ["Hosea", 14], ["Joel", 4], ["Amos", 9], ["Obadiah", 1],
                ["Jonah", 4], ["Micah", 7], ["Nahum", 3], ["Habakkuk", 3], ["Zephaniah", 3],
                ["Haggai", 2], ["Zechariah", 14], ["Malachi", 3], ["Psalms", 150],
                ["Proverbs", 31], ["Job", 42], ["Song_of_Songs", 8], ["Ruth", 4],
                ["Lamentations", 5], ["Ecclesiastes", 12], ["Esther", 10], ["Daniel", 12],
                ["Ezra", 10], ["Nehemiah", 13], ["I_Chronicles", 29], ["II_Chronicles", 36]
            ];

            const totalCycleDays = 742;
            const dayInCycle = diffDays % totalCycleDays;
            
            let currentDay = 0;
            let targetRef = "";

            for (const [book, chapters] of books) {
                if (dayInCycle < currentDay + chapters) {
                    const chapter = (dayInCycle - currentDay) + 1;
                    targetRef = `${book}.${chapter}`;
                    break;
                }
                currentDay += chapters;
            }

            if (targetRef) {
                setTimeout(() => {
                    window.location.href = `https://www.sefaria.org/${targetRef}`;
                }, 600);
            } else {
                document.getElementById('status').innerText = "Unable to calculate today's chapter.";
            }
        }

        startRedirect();
    </script>
</body>
</html>
